name: metricflow
version: "1.0.0"
config-version: 2
profile: metricflow

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: [target, logs]

models:
  metricflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

tests:
  metricflow:
    +severity: error
